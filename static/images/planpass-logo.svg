<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Building shape -->
  <rect x="20" y="40" width="60" height="50" fill="#3B82F6" rx="2" />
  
  <!-- Windows -->
  <rect x="30" y="50" width="10" height="10" fill="#FFFFFF" rx="1" />
  <rect x="50" y="50" width="10" height="10" fill="#FFFFFF" rx="1" />
  <rect x="30" y="70" width="10" height="10" fill="#FFFFFF" rx="1" />
  <rect x="50" y="70" width="10" height="10" fill="#FFFFFF" rx="1" />
  
  <!-- Door -->
  <rect x="40" y="75" width="10" height="15" fill="#10B981" rx="1" />
  
  <!-- Roof -->
  <polygon points="50,20 15,40 85,40" fill="#60A5FA" />
  
  <!-- Magnifying glass -->
  <circle cx="75" cy="35" r="12" fill="none" stroke="#EF4444" stroke-width="4" />
  <line x1="83" y1="43" x2="90" y2="50" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
  
  <!-- Checkmark -->
  <circle cx="75" cy="35" r="6" fill="#10B981" />
  <path d="M70,35 L74,39 L80,31" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
