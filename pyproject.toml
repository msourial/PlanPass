[project]
name = "planpass"
version = "0.1.0"
description = "PlanPass - AI-powered building code compliance checking for IFC/BIM models"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.51.0",
    "flask>=3.1.1",
    "gunicorn>=23.0.0",
    "ifcopenshell>=0.8.2",
    "pymupdf>=1.25.5",
    "werkzeug>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "playwright>=1.45",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []